name: Basic Diet - draft content (manual)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Target platform
        type: choice
        options: [instagram, tiktok, facebook, snapchat]
        default: instagram
        required: true
      goal:
        description: Marketing objective
        type: choice
        options: [auto, awareness, consideration, trust, conversion, engagement]
        default: auto
        required: true
      idea_id:
        description: Optional backlog ID (C003), blank to auto-select
        required: false
        type: string
      use_ai:
        description: Paid AI optional; requires separately configured OPENAI_API_KEY
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate and test
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v
      - name: Prepare offline draft
        if: ${{ !inputs.use_ai }}
        env:
          CHANNEL: ${{ inputs.channel }}
          GOAL: ${{ inputs.goal }}
          IDEA_ID: ${{ inputs.idea_id }}
        run: python3 scripts/daily_brief.py --channel "$CHANNEL" --goal "$GOAL" --idea-id "$IDEA_ID" --dry-run --out-dir output/daily
      - name: Prepare draft with explicitly requested AI suggestions
        if: ${{ inputs.use_ai }}
        env:
          CHANNEL: ${{ inputs.channel }}
          GOAL: ${{ inputs.goal }}
          IDEA_ID: ${{ inputs.idea_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/daily_brief.py --channel "$CHANNEL" --goal "$GOAL" --idea-id "$IDEA_ID" --dry-run --ai --max-output-tokens 1200 --out-dir output/daily
      - name: Upload inspectable draft even if optional AI failed
        if: ${{ always() && hashFiles('output/daily/**/daily-brief.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: basic-diet-daily-draft-${{ github.run_number }}
          path: |
            output/daily/**/daily-brief.json
            output/daily/**/daily-brief.md
            output/daily/**/ai-suggestions.md
          if-no-files-found: error
          retention-days: 14
