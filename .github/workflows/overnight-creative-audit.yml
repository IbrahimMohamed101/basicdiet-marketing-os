name: Basic Diet - overnight creative pipeline audit

on:
  schedule:
    # 12:30 Saudi Arabia (UTC+3); GitHub schedules use UTC
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-handoffs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit actual persisted stages (3 bounded attempts)
        id: audit
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Checking creative stages (attempt $attempt / 3)..."
            python3 scripts/check_scheduled_pipeline.py > overnight-audit.log 2>&1
            code=$?
            cat overnight-audit.log
            if [ "$code" -eq 0 ]; then
              echo "audit_status=pass" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 120; fi
          done
          echo "audit_status=fail" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Store audit in Actions run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Basic Diet overnight creative audit"
            echo '~~~'
            cat overnight-audit.log 2>/dev/null || echo "No log was produced"
            echo '~~~'
            echo "This only validates text handoffs and declared image URLs, not actual image fidelity."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update one actionable GitHub Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Basic Diet: overnight creative pipeline needs attention"
          existing="$(gh issue list --state open --limit 100 --json number,title             --jq ".[] | select(.title == \"$title\") | .number" | head -1 || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file overnight-audit.log
          else
            gh issue create --title "$title" --body-file overnight-audit.log
          fi
      - name: Close recovered failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Basic Diet: overnight creative pipeline needs attention"
          existing="$(gh issue list --state open --limit 100 --json number,title             --jq ".[] | select(.title == \"$title\") | .number" | head -1 || true)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Scheduled audit passed on $(date -u +%Y-%m-%dT%H:%M:%SZ). User review of visuals is still required."
          fi
